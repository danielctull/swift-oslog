name: Test

on:
  - push
  - pull_request

jobs:

  macos:
    name: macOS
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Swift Version
      run: swift --version
    - name: Build
      run: swift build -v
    - name: Test
      run: swift test -v
